          .venv/bin/python tests/native_list_colors_contract.py
          .venv/bin/python tests/native_list_pins_contract.py
          .venv/bin/python tests/native_list_badges_contract.py
          .venv/bin/python tests/native_reminder_order_contract.py
          .venv/bin/python tests/native_reminder_groups_contract.py
          .venv/bin/python tests/native_group_members_contract.py
          .venv/bin/python tests/native_list_groups_contract.py
          .venv/bin/python tests/native_group_order_contract.py
          .venv/bin/python tests/native_reminder_parents_contract.py
          .venv/bin/python tests/native_reminder_sections_contract.py
          .venv/bin/python tests/native_reminder_lifecycle_contract.py
          .venv/bin/python tests/native_reminder_dates_contract.py
          .venv/bin/python tests/native_service_isolation_contract.py
          .venv/bin/python tests/native_permission_contract.py
          .venv/bin/python tests/native_nonprompting_contract.py
          .venv/bin/python scripts/check-dependency-licenses.py
      - name: Compile native helper and inspect permission status without requesting access
        run: |
          .venv/bin/python scripts/build-native-helper.py
          .venv/bin/python - <<'PY'
          import json
          import subprocess
          helper = "build/native/iCloud for Agents.app/Contents/MacOS/icloud-agents-native"
          for service in ("notes", "reminders"):
              request = {"protocol_version": 1, "service": service, "action": "status"}
              result = subprocess.run([helper], input=json.dumps(request), capture_output=True, text=True, check=True, timeout=15)
              response = json.loads(result.stdout)
              assert response.get("protocol_version") == 1 and response.get("service") == service
              assert "error" not in response
              if service == "notes":
                  identity = response["requester_identity"]
                  assert identity["bundle_identifier"] == "com.jasonarend.icloud-for-agents.native"
                  assert identity["bundle_name"] == "iCloud for Agents"
                  assert identity["process_name"] == "icloud-agents-native"
                  assert identity["launch_mode"] == "direct_executable"
                  assert identity["dialog_attribution"] == "not_verified"
          print("Both native service status probes passed; no content access or consent request")
          PY
      - name: Build and inspect distributions
        run: |
          .venv/bin/python -c "import setuptools.build_meta as b; b.build_sdist('dist'); b.build_wheel('dist')"
          .venv/bin/python scripts/check-sdist.py dist/icloud_for_agents-*.tar.gz
